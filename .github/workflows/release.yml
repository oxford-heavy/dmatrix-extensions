name: Release

# Runs in the dmatrix-extensions repo, where this file is rendered from
# packages/canonical-prompt/src/repo-files/workflows/release.yml in the dMatrix monorepo.
# Edit it there; a change made here is overwritten by the next `pnpm extensions:build`.
#
# A `dmatrix--v*` tag (what `claude plugin tag` creates) publishes the decide Skill as
# decide.zip, the archive ChatGPT's Skill upload takes, with its checksum. The file name is
# stable and carries no version, because the guides link
# `releases/latest/download/decide.zip`; the version lives inside the Skill and on the tag.
on:
  push:
    tags:
      - "dmatrix--v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (defaults to the current ref)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Every file the release publishes besides SHA256SUMS.txt. The checksum step and the
      # publish step both read this one list, so neither can publish a file the other missed.
      RELEASE_FILES: decide.zip

    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      # decide.zip has the shape the renderer produces — the decide/ folder at the archive's
      # top level, README left out — because ChatGPT's Skill upload expects exactly that.
      # Entry times are normalized so re-running a release on an unchanged Skill produces
      # the same bytes.
      - name: Build decide.zip
        run: |
          set -eu
          mkdir -p dist
          find skills/decide -exec touch -t 202001010000 {} +
          (cd skills && zip -r -X "${GITHUB_WORKSPACE}/dist/decide.zip" decide -x 'decide/README.md')

      - name: Write the checksums
        working-directory: dist
        run: |
          set -eu
          # shellcheck disable=SC2086 # RELEASE_FILES is a space-separated list of names
          sha256sum $RELEASE_FILES > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write the release notes
        env:
          TAG_INPUT: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          tag="${TAG_INPUT:-$REF_NAME}"
          echo "TAG=${tag}" >> "$GITHUB_ENV"
          guides="https://github.com/${GITHUB_REPOSITORY}/blob/${tag}"
          {
            printf '## The decide Skill\n\n'
            printf '`decide.zip` is the dMatrix decide Skill as ChatGPT takes it: on the '
            printf '**Skills** tab click **Add**, then **Upload from your computer**. The '
            printf 'Skill needs the dMatrix connection on your account; each guide sets it up.\n\n'
            printf 'Check the download against `SHA256SUMS.txt`:\n\n'
            printf '```sh\nshasum -a 256 -c SHA256SUMS.txt\n```\n\n'
            printf '```powershell\nGet-FileHash decide.zip -Algorithm SHA256\n```\n\n'
            printf '## Guides\n\n'
            printf -- '- [Claude](%s/claude/README.md)\n' "$guides"
            printf -- '- [OpenAI (ChatGPT and Codex)](%s/openai/README.md)\n' "$guides"
            printf -- '- [Google (Antigravity)](%s/google/README.md)\n' "$guides"
          } > notes.md
          cat notes.md

      # Create or update: re-running a release for the same tag replaces its files rather
      # than failing, which is what makes a retry after a flaky runner harmless.
      - name: Create or update the GitHub Release
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # shellcheck disable=SC2086 # RELEASE_FILES is a space-separated list of names
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file ../notes.md
            gh release upload "$TAG" $RELEASE_FILES SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" $RELEASE_FILES SHA256SUMS.txt \
              --title "dMatrix extensions ${TAG#dmatrix--}" \
              --notes-file ../notes.md
          fi
          gh release view "$TAG" --json assets --jq '.assets[].name'
